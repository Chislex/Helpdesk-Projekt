services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      # Hier sagen wir Rust, wo die Datenbank im Docker-Netzwerk liegt
      - DATABASE_URL=postgres://admin:secret@db:5432/helpdesk
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

volumes:
  db_data: